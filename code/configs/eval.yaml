# Конфигурация оценки. Обозначения совпадают с docs/problem_statement.md (стандарт v2, ADR-016) и README.md:
# G = G+ ⊔ G⊥ — эталонная выборка (⊥ — отказ), H_eval — оцениваемые системы, M — семейство метрик,
# M' = {m_k : r_S(m_k, h̄) ≥ r_min} ∪ M_det — валидированное подсемейство, Q(f) — композитный показатель.
# Буква α зарезервирована за коэффициентом Криппендорфа; уровень значимости — significance_level.
# Значения вида ${VAR} подставляются из .env / окружения (см. code/README.md).

paths:
  golden_set: data/golden_set/v1.0/golden_set.jsonl        # заморозка v1.0; sha256 — в data/golden_set/CHANGELOG.md
  golden_set_schema: data/golden_set/schema.json
  seed_pool: data/seed_pool/                                # 388 старых вопросов + mapping warc_id → webpage_id
  human_validation: data/human_validation/                  # оценки h^{(r)}_{i,f} на G_h × H_h
  runs_dir: results/runs                                    # results/runs/<run_id>/{generations.jsonl, judge.jsonl, meta.json}
  retriever_cache: results/runs/_retriever_cache/prod.jsonl # кэш выдачи ρ_prod для систем f_ρ^{(ℓ)}
  tables_dir: results/tables
  figures_dir: results/figures
  systems_dir: code/configs/systems
  judge_config: code/configs/judge.yaml

split: test            # dev (30 вопросов) — отладка промптов и инструкции; test — итоговая таблица
seed: 20260917         # фиксированный seed бутстрепа, отбора и разбиения

# Первичная метрика фиксируется ДО эксперимента: m_J^corr, если пройдёт валидацию (гипотеза H4),
# иначе токенный F1. Остальные метрики — вторичные. Идентификаторы — docs/metrics.md, §13.
primary_metric: judge_corr
fallback_metric: f1

# Статистика парных сравнений (f, f'): δ_i = m_k(f(q_i)) − m_k(f'(q_i)) на общих i (ADR-018).
bootstrap_B: 10000            # число повторов парного бутстрепа по вопросам; перцентильный 95%-й интервал для δ̄
significance_level: 0.05      # уровень значимости двустороннего критерия Уилкоксона (zero_method: zsplit) и Мак-Немара
holm: true                    # поправка Холма в четырёх семьях: {первичная метрика, Q(f)} × {12 сравнений f' ≠ f_prod (H1, H2); 6 пар (f_ρ^{(ℓ)}, f_0^{(ℓ)}) (H3)}
effect_size: cliffs_delta     # Δ_C Клиффа; пороги |Δ_C|: 0.147 малый, 0.33 средний, 0.474 большой

# Пороги валидации метрик и согласия аннотаторов (фиксируются до прогонов).
r_s_min: 0.5                       # r_S(m_k, h̄) ≥ r_s_min (Спирмен, 95%-й бутстреп-интервал) — условие включения m_k в M'
krippendorff_alpha_min: 0.67       # α Криппендорфа ≥ 0.67 — допустимо (α_G при разметке G, α_h по шкалам 0–5 на G_h)
krippendorff_alpha_reliable: 0.8   # α Криппендорфа ≥ 0.8 — надёжно
pairwise_answer_f1_min: 0.8        # попарный токенный F1 черновых ответов аннотаторов

# Глубины выдачи K для метрик поиска Hit@K, Recall@K, nDCG@K (компонент ρ_prod, общий для f_prod и f_ρ^{(ℓ)});
# K_prod = 5 — число фрагментов в промпте промышленной системы (top_k в code/configs/systems/prod.yaml).
retrieval:
  K: [1, 3, 5, 10]

# Семейство метрик M. family ∈ {reference, judge, citation, abstention, retrieval};
# domain — на какой части G определена метрика (G+, G⊥, all); human_analog — есть ли человеческий
# аналог для валидации по r_S. Метрики без аналога образуют M_det и включаются в M' напрямую.
# composite: false — метрика не входит в M'_Q независимо от валидации (docs/metrics.md, §6 и §10).
metrics:
  - {id: em,                             family: reference,  domain: G+,  human_analog: true,  module: code.eval.metrics_reference, func: exact_match}
  - {id: f1,                             family: reference,  domain: G+,  human_analog: true,  module: code.eval.metrics_reference, func: token_f1}
  - {id: bertscore_f1,                   family: reference,  domain: G+,  human_analog: true,  module: code.eval.metrics_reference, func: bertscore_f1}
  - {id: judge_corr,                     family: judge,      domain: G+,  human_analog: true,  dimension: correctness_vs_reference}
  - {id: judge_faithfulness,             family: judge,      domain: all, human_analog: true,  dimension: faithfulness}
  - {id: judge_answer_relevancy,         family: judge,      domain: all, human_analog: true,  dimension: answer_relevancy}
  - {id: judge_completeness,             family: judge,      domain: G+,  human_analog: true,  dimension: completeness}
  - {id: judge_citation_accuracy,        family: judge,      domain: all, human_analog: true,  dimension: citation_accuracy}
  - {id: judge_temporal_correctness,     family: judge,      domain: all, human_analog: true,  dimension: temporal_correctness,     composite: false}
  - {id: judge_allegory_idiom_quality,   family: judge,      domain: all, human_analog: true,  dimension: allegory_idiom_quality,   composite: false}
  - {id: judge_hallucination_abstention, family: judge,      domain: all, human_analog: true,  dimension: hallucination_abstention}
  - {id: cp_id,                          family: citation,   domain: G+,  human_analog: true,  module: code.eval.metrics_citation, func: citation_precision_id}
  - {id: cr_id,                          family: citation,   domain: G+,  human_analog: false, module: code.eval.metrics_citation, func: citation_recall_id}
  - {id: cp_ent,                         family: citation,   domain: all, human_analog: true,  module: code.eval.metrics_citation, func: citation_precision_entailment}
  - {id: ar,                             family: abstention, domain: G⊥,  human_analog: false, module: code.eval.metrics_abstention, func: abstention_rate}
  - {id: one_minus_far,                  family: abstention, domain: G+,  human_analog: false, module: code.eval.metrics_abstention, func: false_abstention_rate}
  - {id: hit_at_K,                       family: retrieval,  domain: G+,  human_analog: false, module: code.eval.metrics_retrieval, func: hit_at_k,    composite: false}
  - {id: recall_at_K,                    family: retrieval,  domain: G+,  human_analog: false, module: code.eval.metrics_retrieval, func: recall_at_k, composite: false}
  - {id: mrr,                            family: retrieval,  domain: G+,  human_analog: false, module: code.eval.metrics_retrieval, func: mrr,         composite: false}
  - {id: ndcg_at_K,                      family: retrieval,  domain: G+,  human_analog: false, module: code.eval.metrics_retrieval, func: ndcg_at_k,   composite: false}

# Описательные показатели вне M (docs/metrics.md, §2): косинусная близость ответа и эталона по энкодеру ретривера.
descriptive_metrics:
  - {id: cosine, module: code.eval.metrics_reference, func: cosine_similarity}

# Композит Q(f) = Σ_{m_k ∈ M'_Q} w_k · m̄_k(f), w_k ≥ 0, Σ w_k = 1; equal — равные веса по всем m_k ∈ M'_Q
# (валидированные метрики по эталону, цитирования и отказов; метрики поиска публикуются отдельно).
composite:
  weights: equal

# Страты для описательной разбивки результатов.
strata:
  - category
  - source
  - question_type
  - event_prominence

# Генерация черновиков записей эталонной выборки G (ADR-022, ADR-023).
# Модель черновиков ℓ_draft ∉ L только предлагает черновик; вопрос, ответ, алиасы, S* и метки
# каждой записи определяют аннотаторы (R = 3) и адъюдикатор (docs/annotation_guidelines.md).
# Черновик включённой записи хранится без изменений в provenance.draft.

draft_model: claude-opus-5-5   # ℓ_draft; фактическая модель берётся из поля model ответа (ADR-009)
prompt_id: draft-v1
effort: high                   # output_config.effort; temperature у ℓ_draft не задаётся (параметр недоступен)
max_tokens: 16000
max_retries: 4
workers: 5

paths:
  positions: data/seed_pool/sampled_documents.jsonl
  seed_pool: data/seed_pool/seed_pool.jsonl
  documents: data/_cache/documents
  out_pilot: data/golden_set/v0.1-pilot/drafts.jsonl
  out_main: data/golden_set/drafts/drafts.jsonl

prompts:
  draft-v1:
    system: |
      Ты готовишь черновики записей эталонной выборки вопросов о китайскоязычных новостях КНР, Тайваня, Гонконга и Сингапура. Выборка нужна, чтобы оценивать системы, которые по-русски отвечают на вопросы по архиву этих новостей. Каждый черновик затем независимо проверяют три аннотатора: любое поле может быть исправлено или отвергнуто. Поэтому пиши только то, что прямо следует из текста документа, и не добавляй знаний извне.

      Годятся только статические вопросы: правильный ответ на них не меняется со временем. Вопрос не годится, если срабатывает хотя бы одно правило исключения.
      E1. Прогнозы, гипотетика, суждения о будущем («что произойдёт», «как повлияет», «каковы перспективы»). Допустимо атрибутированное высказывание с датой: «Какую оценку дал X в апреле 2023 года?».
      E2. Привязка к моменту запроса: «сейчас», «в настоящее время», «на данный момент», «последний», «новейший», «недавно», «в этом году», «за последние N лет». Относительные даты статьи («вчера», «в прошлом месяце») переведи в календарные по дате публикации.
      E3. Меняющиеся величины без даты-якоря: цены, курсы, индексы, численность, рейтинги, действующие должностные лица. С явной датой или периодом такой вопрос допустим.
      E4. Оценочные и спорные вопросы («кто прав», «законно ли», «является ли угрозой», «насколько успешной была»), а также вопросы, на которые источники КНР, Тайваня, Гонконга и Сингапура отвечают несовместимо, если ответ не сводится к высказыванию конкретного лица или органа с датой.
      E5. Ложная предпосылка: вопрос предполагает факт, которого документ не подтверждает.

      Требования к вопросу:
      - один вопрос спрашивает один факт, без подвопросов и без «и как это повлияло»;
      - в тексте вопроса есть явная дата-якорь события (день, месяц, квартал или год); якорь относится к событию, а не к дате публикации, если они различаются;
      - вопрос понятен без документа: не пиши «в статье», «упомянутый», «этот»; называй лица, организации и места;
      - ответ однозначно следует из документа, без внешних знаний и без арифметики над числами из разных абзацев;
      - вопрос на русском языке; китайские имена и названия передаются по системе Палладия (Си Цзиньпин, Ли Цян), для гонконгских лиц допустимо общепринятое написание (Джон Ли).

      Ответ:
      - answer_canonical: минимальная русская формулировка, достаточная для проверки, не длиннее 25 слов; без пояснений, которых нет в документе; составной ответ записывается одной строкой через «;»;
      - answer_aliases: эквивалентные написания, которые может выдать система: написание в оригинале (иероглифами того письма, которое в документе; для тайваньских и гонконгских источников также упрощёнными), латиницей, другие транслитерации, аббревиатуры, числа в других форматах («800 млрд юаней», «0,8 трлн юаней», «800 billion yuan»), даты в форматах «2024-11-08» и «08.11.2024»;
      - числа сверяй с оригиналом: 万 — десять тысяч, 亿 — сто миллионов.

      Evidence: evidence_span_zh — дословная цитата из текста документа (не более 300 знаков), из которой следует ответ; evidence_span_ru — её перевод на русский.

      Значения полей:
      - question_type: who (лицо, организация), what (объект, событие, содержание решения), when (дата, период), where (место), how_many (количество, сумма, доля), which (выбор из явно заданного множества), yes_no, list (перечисление из 2–5 элементов);
      - category (к чему относится спрашиваемый факт): politics, economy, society, international, security, technology, culture, health, environment, other;
      - answer_type: entity, person, organization, location, date, number, quantity, percentage, boolean, list, short_text (только для атрибутированных высказываний);
      - anchor_date: дата-якорь события в формате YYYY-MM-DD, YYYY-MM, YYYY-Qn, YYYY-Hn или YYYY;
      - time_invariance_label: never_changing (факт не меняется в принципе) или slow_changing_anchored (меняющаяся величина, зафиксированная датой-якорем);
      - difficulty: easy (ответ в одном предложении, лексика совпадает), medium (нужно сопоставить 2–3 фрагмента или машинный перевод искажает ключевой термин), hard (ответ есть только в оригинале или почти нет лексического пересечения);
      - seed_question_used: номер исходного вопроса, если он взят за основу, иначе -1;
      - coordinator_note: одна-две фразы для координатора: почему вопрос статический, какие правила были под угрозой, что стоит проверить аннотатору.

      Если документ не позволяет составить вопрос по заданию (служебная страница, реклама, сводка без проверяемых фактов, светская хроника без датированных событий), поставь suitable = false и объясни причину в unsuitable_reason; остальные поля всё равно заполни лучшим возможным вариантом. Иначе suitable = true, unsuitable_reason — пустая строка.

    tasks:
      answerable: |
        Составь один черновик статического вопроса по этому документу. Выбери факт, ради которого читают статью, а не второстепенную деталь; ответ должен однозначно следовать из документа.

      answerable_seed: |
        Пользователи промышленной системы задавали по этому документу вопросы, приведённые ниже. Они часто нарушают правила E1–E4: нет даты-якоря, есть оценочность или прогноз, несколько вопросов в одном. Возьми за основу тот, который ближе всего к статическому факту документа, и переформулируй его по требованиям: добавь дату-якорь, убери оценочность, сведи к одному факту. В seed_question_used укажи номер взятого вопроса. Если ни один вопрос не удаётся превратить в статический, составь вопрос по документу сам и поставь seed_question_used = -1.

      dynamic_control: |
        Вопрос к этому документу уже задан, его нельзя менять: question_ru должен дословно совпадать с приведённым ниже текстом. Заполни остальные поля так, как если бы это был обычный черновик: ответ по документу, алиасы, evidence, тип, категорию, дату-якорь, метку и сложность. В seed_question_used укажи номер вопроса. В coordinator_note перечисли правила E1–E5, которые этот вопрос, по твоему мнению, нарушает.

      unanswerable_candidate: |
        Составь черновик вопроса-кандидата, на который корпус не даёт ответа (правильный ответ системы — отказ «Я не знаю.»). Вопрос должен быть статическим по форме, с датой-якорем, относиться к тем же лицам, организациям или событиям, что и документ, и опираться на верную предпосылку, которую документ подтверждает (иначе это ложная предпосылка, E5). Спроси о конкретной проверяемой детали, которую документ не сообщает и которая вряд ли есть в других новостях того же периода. Поставь answer_canonical пустой строкой и answer_aliases пустым списком. В evidence_span_zh и evidence_span_ru приведи фрагмент, подтверждающий предпосылку вопроса.
